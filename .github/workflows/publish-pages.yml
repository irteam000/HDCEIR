name: 리포트를 GitHub Pages에 게시

on:
  schedule:
    # 2시간마다 자동 갱신 (UTC 기준, 24시간 내내)
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write    # 캐시(cache/) 커밋을 위해 write
  pages: write
  id-token: write

# 동시 실행 방지 (캐시 커밋 충돌 방지)
concurrency:
  group: "pages-ir-monitor"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 리포트 생성 (IR 변경 감지)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          SECRET_PATH="xl9UUV5MldV6S_ba"
          mkdir -p "site/${SECRET_PATH}"
          python competitor_monitor.py --out "site/${SECRET_PATH}/index.html"
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          echo '<!doctype html><meta name="robots" content="noindex"><title>.</title>' > site/index.html

      - name: 캐시 저장 (변경 감지 상태 유지)
        run: |
          git config user.name "ir-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cache/ir_updates.json cache/update_history.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "update IR cache [skip ci]"
            git push
          else
            echo "캐시 변경 없음"
          fi

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 산출물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
