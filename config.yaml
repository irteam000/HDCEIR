# 경쟁사 모니터링 설정 — 건설기계 업종
# ─────────────────────────────────────────────

company_name: "우리회사"

# 뉴스 수집 기본 언어/국가 (회사별 lang/country가 없을 때 사용)
news_language: "en"
news_country: "US"

# 수집 범위
news_lookback_hours: 168       # 최근 N시간 내 뉴스만 (168 = 7일)
max_news_per_competitor: 8     # 경쟁사별 최대 뉴스 건수

report_title: "건설기계 경쟁사 동향 위클리 브리핑"

# 메일 수신자 (--send 사용 시). SMTP 접속정보는 환경변수로 설정.
mail_to:
  - "ir-team@ourcompany.com"

# ─────────────────────────────────────────────
# 모니터링 대상 경쟁사 (건설기계)
#   name     : 리포트 표시 이름
#   keywords : 뉴스 검색 키워드 (여러 개 가능, OR 조건)
#   ticker   : 주가 티커 (yfinance 형식)
#   region   : 표시용 지역 태그
#   lang/country : 이 회사 전용 뉴스 언어/국가 (비우면 위 기본값 사용)
#                  국내사는 ko/KR, 해외사는 en/US 식으로 지정
# ─────────────────────────────────────────────
competitors:
  - name: "캐터필러"
    keywords: ["Caterpillar", "CAT construction equipment"]
    ticker: "CAT"
    region: "US"
    lang: "en"
    country: "US"

  - name: "고마쓰"
    keywords: ["Komatsu", "Komatsu construction"]
    ticker: "6301.T"
    region: "JP"
    lang: "en"
    country: "US"

  - name: "히타치건설기계"
    keywords: ["Hitachi Construction Machinery"]
    ticker: "6305.T"
    region: "JP"
    lang: "en"
    country: "US"

  - name: "두산밥캣"
    keywords: ["두산밥캣", "밥캣"]
    ticker: "241560.KS"
    region: "KR"
    lang: "ko"
    country: "KR"

  - name: "HD건설기계"
    keywords: ["HD건설기계", "HD현대건설기계", "HD현대인프라코어"]
    ticker: "267270.KS"
    region: "KR"
    lang: "ko"
    country: "KR"

  - name: "싼이중공업 (SANY)"
    keywords: ["SANY Heavy Industry", "Sany excavator"]
    ticker: "600031.SS"
    region: "CN"
    lang: "en"
    country: "US"
